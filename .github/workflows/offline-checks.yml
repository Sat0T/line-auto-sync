name: Offline Python checks
on:
  push:
    branches: [main, "fix/**", "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax and offline synthetic SQLite tests
        run: |
          python -m compileall -q normal-only-rc1 tests
          python -m unittest discover -s tests -v
      - name: Build unshared private .deb and verify archive
        run: python tools/build_private_beta.py

  history-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch repository branches for history coverage
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reachable Git blobs and public commit metadata (redacted report)
        run: python tools/audit_git_history.py

  mvp-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GAS entry points with disposable service doubles
        run: node --test tests/test_mvp.js
      - name: Collector to receiver to precomputed AI receipt to task sheet
        run: python tools/demo_mvp.py
